<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rhythm Avatar</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #090b10; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    h1 {
      position: absolute;
      left: 32px;
      top: 26px;
      margin: 0;
      color: rgba(244, 236, 220, 0.72);
      font-family: "Palatino Linotype", "Songti SC", "Microsoft YaHei", serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.28em;
    }
    #connect {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      border: 1px solid rgba(244, 236, 220, 0.28);
      border-radius: 999px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(244, 236, 220, 0.82);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    #connect[hidden] { display: none; }
    .chip {
      border: 1px solid rgba(244, 236, 220, 0.28);
      border-radius: 999px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(244, 236, 220, 0.82);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    #scene {
      position: absolute;
      right: 32px;
      top: 22px;
    }
    #end {
      position: absolute;
      right: 32px;
      bottom: 28px;
    }
    #end[hidden] { display: none; }
    #recap {
      position: absolute;
      left: 28px;
      top: 72px;
      width: 360px;
      padding: 16px 16px 14px;
      border: 1px solid rgba(244, 236, 220, 0.16);
      border-radius: 18px;
      background: #10141a;
      color: rgba(244, 236, 220, 0.88);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    #recap[hidden] { display: none; }
    #recap p {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: 0.22em;
    }
    #score { position: relative; min-height: 28px; }
    .lane {
      display: flex;
      align-items: center;
      height: 28px;
      gap: 8px;
    }
    .lane span {
      width: 42px;
      flex: none;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(244, 236, 220, 0.62);
    }
    .track {
      position: relative;
      flex: 1;
      height: 22px;
    }
    .track b {
      position: absolute;
      top: 2px;
      font-weight: 500;
      font-size: 13px;
      font-style: normal;
      letter-spacing: 0;
      transform: translateX(-50%);
    }
    #playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50px;
      width: 1px;
      background: rgba(240, 195, 106, 0.9);
      pointer-events: none;
    }
    .recap-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    #empty-take {
      margin: 8px 0 4px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(244, 236, 220, 0.62);
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <h1>Rhythm Avatar</h1>
  <button id="scene" class="chip" type="button">地铁</button>
  <button id="end" class="chip" type="button">一曲结束</button>
  <aside id="recap" hidden>
    <p>这一曲</p>
    <div id="score"></div>
    <div class="recap-actions">
      <button id="replay" class="chip" type="button">再看一遍</button>
      <button id="reset" class="chip" type="button">再来一曲</button>
    </div>
  </aside>
  <button id="connect" type="button" hidden>连接设备</button>
  <script>
    const ACTIONS = {
      "左手": "leftArm",
      "右手": "rightArm",
      "左脚": "leftLeg",
      "右脚": "rightLeg",
      "跳跃": "jump",
      "转身": "turn",
    };
    const KEYS = { a: "左手", s: "右手", d: "左脚", f: "右脚", j: "跳跃", k: "转身" };
    const BIAS = {
      leftArm: ["leftArm", "rightArm", "leftLeg"],
      rightArm: ["rightArm", "leftArm", "rightLeg"],
      leftLeg: ["leftLeg", "leftArm", "rightArm"],
      rightLeg: ["rightLeg", "rightArm", "leftArm"],
      jump: ["jump", "leftLeg", "rightLeg"],
      turn: ["turn", "leftArm", "rightArm"],
    };

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const connectBtn = document.getElementById("connect");

    const STAND = {
      lean: 0, weight: 0, hipDrop: 0, spin: 0, width: 1,
      armL: -1.15, elbowL: 0.42, armR: 1.15, elbowR: 0.42,
      shoulderL: 0, shoulderR: 0,
      footLx: -26, footLy: 0, footRx: 26, footRy: 0,
      face: 1,
    };
    const CHANNELS = Object.keys(STAND);
    const NEUTRAL = pose({
      hipDrop: 6,
      armL: -1.15, elbowL: 0.55, shoulderL: 0.08,
      armR: 1.15, elbowR: 0.55, shoulderR: 0.08,
      footLx: -26, footRx: 26,
    });
    const HOLD = pose({
      hipDrop: 3,
      lean: 0.04,
      weight: -4,
      armL: -2.95,
      elbowL: 0.08,
      shoulderL: 1.05,
      armR: 0.95,
      elbowR: 0.4,
      footLx: -18,
      footRx: 22,
    });

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function pose(partial) {
      return { ...STAND, ...partial };
    }

    function mirrorPose(frame) {
      return {
        lean: -frame.lean,
        weight: -frame.weight,
        hipDrop: frame.hipDrop,
        spin: typeof frame.spin === "number" ? -frame.spin : frame.spin,
        width: frame.width,
        armL: -frame.armR,
        elbowL: frame.elbowR,
        armR: -frame.armL,
        elbowR: frame.elbowL,
        shoulderL: frame.shoulderR,
        shoulderR: frame.shoulderL,
        footLx: -frame.footRx,
        footLy: frame.footRy,
        footRx: -frame.footLx,
        footRy: frame.footLy,
        face: frame.face,
      };
    }

    function pack(home, title, mirrorTitle, dur, partials) {
      return {
        title,
        mirrorTitle,
        dur,
        frames: partials.map((partial) => ({ ...home, ...partial })),
      };
    }

    function mirrorMove(move) {
      return {
        title: move.mirrorTitle,
        dur: move.dur,
        frames: move.frames.map(mirrorPose),
      };
    }

    function smoothstep(t) {
      t = clamp(t, 0, 1);
      return t * t * (3 - 2 * t);
    }

    function segmentEase(name, t) {
      if (name === "pop") return t < 0.28 ? smoothstep(t / 0.28) : 1;
      const s = smoothstep(t);
      if (name === "hiphop") return s + Math.sin(s * Math.PI) * 0.14;
      return s;
    }

    function lerpPose(a, b, t) {
      const out = {};
      for (const key of CHANNELS) out[key] = a[key] + (b[key] - a[key]) * t;
      return out;
    }

    function sampleFrames(frames, u, ease) {
      const spans = Math.max(1, frames.length - 1);
      const x = clamp(u, 0, 1) * spans;
      const i = Math.min(spans - 1, Math.floor(x));
      return lerpPose(frames[i], frames[i + 1], segmentEase(ease, x - i));
    }

    function bindFrame(frame, from, to) {
      const dir = to < from ? 1 : -1;
      let face = from;
      if (frame.face === "to") face = to;
      let spin = 0;
      if (frame.spin === "dir") spin = 1.2 * dir;
      else if (frame.spin === "back") spin = -0.28 * dir;
      else if (typeof frame.spin === "number") spin = frame.spin;
      return { ...frame, face, spin };
    }

    function finishPose(frame) {
      const next = { ...frame };
      next.lean = clamp(next.lean, -0.85, 0.85);
      next.weight = clamp(next.weight, -28, 28);
      next.hipDrop = clamp(next.hipDrop, -88, 32);
      next.spin = clamp(next.spin, -1.5, 1.5);
      next.width = clamp(next.width, 0.32, 1);
      next.footLx = clamp(next.footLx, -78, 48);
      next.footRx = clamp(next.footRx, -48, 78);
      next.footLy = clamp(next.footLy, -88, 0);
      next.footRy = clamp(next.footRy, -88, 0);
      next.armL = clamp(next.armL, -3.2, 1.7);
      next.armR = clamp(next.armR, -1.7, 3.2);
      next.elbowL = clamp(next.elbowL, 0, 1.6);
      next.elbowR = clamp(next.elbowR, 0, 1.6);
      next.shoulderL = clamp(next.shoulderL, 0, 1.45);
      next.shoulderR = clamp(next.shoulderR, 0, 1.45);
      next.face = clamp(next.face, -1, 1);
      return next;
    }

    const HOME = {
      hiphop: pose({
        lean: 0.06, weight: 4, hipDrop: 12,
        armL: -0.72, elbowL: 1.15, shoulderL: 0.22,
        armR: 0.78, elbowR: 1.1, shoulderR: 0.12,
        footLx: -30, footRx: 34,
      }),
      jazz: pose({
        lean: -0.1, weight: -2, hipDrop: 2,
        armL: -1.9, elbowL: 0.08, shoulderL: 0.4,
        armR: 0.5, elbowR: 0.9, shoulderR: 0.05,
        footLx: -20, footRx: 18, footRy: -6,
      }),
      pop: pose({
        hipDrop: 5,
        armL: -1.35, elbowL: 0.32, shoulderL: 0.05,
        armR: 1.35, elbowR: 0.32, shoulderR: 0.05,
        footLx: -26, footRx: 26,
      }),
    };

    function libraryFor(styleId) {
      const home = HOME[styleId];
      if (styleId === "hiphop") {
        return {
          leftArm: [
            pack(home, "甩臂踏步", "右侧甩臂", 1000, [
              { hipDrop: 20, lean: 0.22, weight: 12, armL: -0.4, elbowL: 1.4, shoulderL: 0.7, armR: 0.45, elbowR: 1.3, shoulderR: 0.2, footLx: -24, footRx: 30 },
              { hipDrop: 8, lean: -0.4, weight: -16, armL: 1.05, elbowL: 0.2, shoulderL: 0.1, armR: 2.2, elbowR: 0.25, shoulderR: 0.55, footLx: -66, footLy: -4, footRx: 12 },
              { hipDrop: 18, lean: 0.28, weight: -8, armL: -2.6, elbowL: 0.35, shoulderL: 1.1, armR: 0.3, elbowR: 1.35, footLx: -46, footRx: 6, footRy: -12 },
              {},
            ]),
            pack(home, "耸肩出臂", "右侧出臂", 960, [
              { hipDrop: 16, weight: 6, lean: 0.08, armL: -0.85, elbowL: 1.5, shoulderL: 1.25, armR: 0.8, elbowR: 1.45, shoulderR: 1.05, footLx: -28, footRx: 28 },
              { hipDrop: 9, lean: 0.5, weight: -14, armL: -2.25, elbowL: 0.05, shoulderL: 0.25, armR: 0.55, elbowR: 1.25, footLx: -14, footLy: -48, footRx: 24 },
              { hipDrop: 22, lean: -0.28, weight: 10, armL: -1.65, elbowL: 0.15, shoulderL: 0.35, armR: 1.7, elbowR: 0.1, shoulderR: 0.25, footLx: -38, footRx: 42 },
              {},
            ]),
          ],
          leftLeg: [
            pack(home, "侧向踏步", "右侧踏步", 1040, [
              { hipDrop: 14, weight: 14, lean: -0.18, armL: -1.7, elbowL: 0.35, armR: 0.35, elbowR: 1.05, footLx: -18, footRx: 38 },
              { hipDrop: 6, weight: -18, lean: 0.4, armL: -2.45, elbowL: 0.1, shoulderL: 0.55, armR: 0.15, elbowR: 0.85, footLx: -72, footRx: 14 },
              { hipDrop: 22, weight: -2, lean: 0.12, armL: -0.7, elbowL: 1.25, shoulderL: 0.75, armR: 1.65, elbowR: 0.25, shoulderR: 0.3, footLx: -42, footLy: -6, footRx: 20 },
              {},
            ]),
            pack(home, "提膝踩点", "右膝踩点", 1000, [
              { hipDrop: 16, weight: 8, armL: -1.2, elbowL: 1.1, armR: 1.15, elbowR: 1.05, footLx: -22, footRx: 26 },
              { hipDrop: 2, weight: 12, lean: -0.22, armL: -2.0, elbowL: 0.85, shoulderL: 0.45, armR: 1.15, elbowR: 1.05, footLx: -6, footLy: -72, footRx: 22 },
              { hipDrop: 20, weight: -16, lean: 0.34, armL: -0.35, elbowL: 0.55, armR: 1.9, elbowR: 0.15, shoulderR: 0.4, footLx: -64, footRx: 16 },
              {},
            ]),
          ],
          jump: [
            pack(home, "屈膝弹跳", "", 1180, [
              { hipDrop: 26, armL: -0.35, elbowL: 0.85, armR: 0.4, elbowR: 0.8, footLx: -16, footRx: 16 },
              { hipDrop: -52, armL: -1.25, elbowL: 1.25, shoulderL: 0.85, armR: 1.2, elbowR: 1.2, shoulderR: 0.85, footLx: -18, footLy: -76, footRx: 18, footRy: -76 },
              { hipDrop: 28, armL: -0.45, elbowL: 1.15, armR: 0.5, elbowR: 1.1, footLx: -36, footRx: 36 },
              {},
            ]),
            pack(home, "开合弹跳", "", 1100, [
              { hipDrop: 18, armL: -0.5, elbowL: 1.0, armR: 0.5, elbowR: 1.0, footLx: -14, footRx: 14 },
              { hipDrop: -42, armL: -2.15, elbowL: 0.55, shoulderL: 0.7, armR: 2.05, elbowR: 0.5, shoulderR: 0.7, footLx: -42, footLy: -62, footRx: 42, footRy: -62 },
              { hipDrop: 16, weight: -6, armL: -1.4, elbowL: 0.9, armR: 1.5, elbowR: 0.4, footLx: -48, footRx: 28 },
              {},
            ]),
          ],
          turn: [
            pack(home, "收臂转身", "", 1120, [
              { hipDrop: 16, width: 0.92, armL: 0.45, elbowL: 1.15, armR: -0.35, elbowR: 1.1, footLx: -24, footRx: 24, face: "from" },
              { hipDrop: 8, width: 0.36, spin: "dir", armL: -1.1, elbowL: 0.7, armR: 1.05, elbowR: 0.7, face: "from" },
              { hipDrop: 14, width: 0.4, spin: "dir", armL: -0.8, elbowL: 1.1, armR: 0.9, elbowR: 1.0, weight: -6, face: "to" },
              { face: "to" },
            ]),
            pack(home, "展臂转身", "", 1200, [
              { hipDrop: 8, armL: -2.5, elbowL: 0.1, armR: 0.6, elbowR: 1.0, footLx: -28, footRx: 22, face: "from" },
              { hipDrop: 4, width: 0.34, spin: "dir", armL: -2.2, elbowL: 0.05, armR: 2.1, elbowR: 0.05, face: "from" },
              { hipDrop: 12, width: 0.42, spin: "back", lean: 0.2, armL: -1.8, elbowL: 0.2, armR: 1.6, elbowR: 0.3, footLx: -40, footRx: 18, face: "to" },
              { face: "to" },
            ]),
          ],
          groove: [
            pack(home, "身体律动", "右侧律动", 1100, [
              { hipDrop: 18, weight: 14, lean: 0.2, shoulderL: 1.15, armL: -0.6, elbowL: 1.3, armR: 0.7, elbowR: 1.15, footLx: -22, footRx: 36 },
              { hipDrop: 14, weight: -16, lean: -0.28, shoulderR: 1.15, armL: -1.3, elbowL: 0.9, armR: 0.4, elbowR: 1.35, footLx: -40, footRx: 20 },
              { hipDrop: 24, weight: 2, shoulderL: 0.6, shoulderR: 0.55, armL: -0.4, elbowL: 1.2, armR: 0.45, elbowR: 1.15, footLx: -32, footRx: 32 },
              {},
            ]),
          ],
          freeze: [
            pack(home, "律动定格", "右侧定格", 1240, [
              { hipDrop: 10, lean: 0.18, weight: -6, armL: -1.5, elbowL: 0.8, armR: 0.7, elbowR: 1.0, footLx: -36, footRx: 20 },
              { hipDrop: 14, lean: 0.32, weight: -12, armL: -2.4, elbowL: 0.2, shoulderL: 0.9, armR: 0.35, elbowR: 1.35, footLx: -54, footLy: -8, footRx: 12 },
              { hipDrop: 14, lean: 0.32, weight: -12, armL: -2.4, elbowL: 0.2, shoulderL: 0.9, armR: 0.35, elbowR: 1.35, footLx: -54, footLy: -8, footRx: 12 },
              {},
            ]),
          ],
        };
      }
      if (styleId === "jazz") {
        const line = { hipDrop: 0, lean: 0.5, weight: -8, armL: -3.0, elbowL: 0.02, shoulderL: 1.3, armR: 0.2, elbowR: 1.3, footLx: -60, footLy: -12, footRx: 12 };
        const statue = { hipDrop: 0, lean: 0.48, weight: -6, armL: -2.95, elbowL: 0.02, shoulderL: 1.3, armR: 0.15, elbowR: 1.35, footLx: -62, footLy: -16, footRx: 14 };
        return {
          leftArm: [
            pack(home, "手臂延展", "右臂延展", 1460, [
              { hipDrop: 10, armL: -1.0, elbowL: 0.7, armR: 0.9, elbowR: 0.65, footLx: -18, footRx: 18, lean: 0 },
              line,
              { hipDrop: -4, lean: 0.62, weight: -4, armL: -3.1, elbowL: 0, shoulderL: 1.35, armR: 0.05, elbowR: 1.4, footLx: -68, footLy: -22, footRx: 14 },
              {},
            ]),
            pack(home, "弧线挥臂", "右臂弧线", 1400, [
              { hipDrop: 6, armL: -0.4, elbowL: 0.3, armR: 0.35, elbowR: 0.35, footLx: -22, footRx: 22 },
              { hipDrop: 2, lean: 0.15, spin: 0.35, armL: -2.7, elbowL: 0.05, shoulderL: 1.0, armR: 1.4, elbowR: 0.15, footLx: -30, footLy: -4, footRx: 24, footRy: -16 },
              { hipDrop: 4, lean: -0.35, weight: 8, armL: -1.2, elbowL: 0.9, armR: 2.3, elbowR: 0.1, shoulderR: 0.7, footLx: -16, footRx: 36, footRy: -20 },
              {},
            ]),
          ],
          leftLeg: [
            pack(home, "侧踢", "右踢", 1400, [
              { hipDrop: 14, armL: -2.1, elbowL: 0.45, armR: 2.0, elbowR: 0.4, footLx: -16, footRx: 16 },
              { hipDrop: -6, lean: -0.28, weight: 16, armL: -0.2, elbowL: 0.08, armR: 2.55, elbowR: 0.02, shoulderR: 0.9, footLx: -16, footLy: -82, footRx: 14 },
              { hipDrop: -2, lean: 0.05, weight: 8, armL: -2.4, elbowL: 0.04, shoulderL: 0.8, armR: 2.35, elbowR: 0.04, shoulderR: 0.7, footLx: -34, footLy: -68, footRx: 16 },
              {},
            ]),
            pack(home, "点地延伸", "右侧点地", 1360, [
              { hipDrop: 4, armL: -1.5, elbowL: 0.2, armR: 1.4, elbowR: 0.2 },
              { hipDrop: 1, lean: 0.42, weight: -4, armL: -2.85, elbowL: 0.02, shoulderL: 1.1, armR: 0.3, elbowR: 1.15, footLx: -74, footLy: -2, footRx: 10 },
              { lean: 0.58, armL: -3.05, elbowL: 0, shoulderL: 1.3, armR: 0.15, elbowR: 1.25, footLx: -74, footLy: -6, footRx: 12 },
              {},
            ]),
          ],
          jump: [
            pack(home, "分腿跳", "", 1500, [
              { hipDrop: 16, armL: -0.8, elbowL: 0.5, armR: 0.75, elbowR: 0.5, footLx: -14, footRx: 14 },
              { hipDrop: -60, lean: -0.22, armL: -2.55, elbowL: 0.04, shoulderL: 1.15, armR: 2.5, elbowR: 0.04, shoulderR: 1.1, footLx: -28, footLy: -74, footRx: 46, footRy: -36 },
              { hipDrop: 6, lean: -0.12, weight: 6, armL: -2.3, elbowL: 0.08, armR: 1.9, elbowR: 0.1, footLx: -14, footRx: 44, footRy: -30 },
              {},
            ]),
            pack(home, "落步定格", "", 1560, [
              { hipDrop: 12, armL: -2.0, elbowL: 0.2, armR: 0.4, elbowR: 0.6 },
              { hipDrop: -36, lean: 0.15, armL: -2.6, elbowL: 0.05, armR: 1.5, elbowR: 0.1, footLx: -10, footLy: -64, footRx: 24, footRy: -50 },
              statue,
              statue,
              {},
            ]),
          ],
          turn: [
            pack(home, "转身展线", "", 1600, [
              { hipDrop: 6, armL: -2.2, elbowL: 0.15, armR: 0.3, elbowR: 0.4, footLx: -20, footRx: 16, face: "from" },
              { hipDrop: 2, width: 0.34, spin: "dir", armL: -1.5, elbowL: 0.2, armR: 1.4, elbowR: 0.2, face: "from" },
              { width: 0.36, spin: "dir", face: "to", hipDrop: 0 },
              { ...line, width: 1, spin: 0, face: "to" },
              { ...line, width: 1, spin: 0, face: "to" },
              { face: "to" },
            ]),
            pack(home, "旋转定格", "", 1580, [
              { hipDrop: 8, armL: -1.6, elbowL: 0.4, armR: 1.5, elbowR: 0.35, face: "from" },
              { width: 0.34, spin: "dir", hipDrop: 2, armL: -2.0, elbowL: 0.1, armR: 1.9, elbowR: 0.1, face: "from" },
              { width: 0.36, spin: "dir", face: "to" },
              { ...statue, face: "to", width: 1 },
              { ...statue, face: "to", width: 1 },
              { face: "to" },
            ]),
          ],
          line: [
            pack(home, "双臂线条", "双臂线条", 1500, [
              { hipDrop: 4, armL: -0.3, elbowL: 0.1, armR: 0.3, elbowR: 0.1 },
              { hipDrop: -2, lean: -0.08, armL: -2.7, elbowL: 0.02, shoulderL: 1.2, armR: 2.65, elbowR: 0.02, shoulderR: 1.2, footRx: 28, footRy: -18 },
              { hipDrop: 2, lean: 0.2, armL: -1.7, elbowL: 0.02, armR: 1.65, elbowR: 0.02, footLx: -40, footLy: -4 },
              {},
            ]),

    function withSides(group) {
      return {
        ...group,
        rightArm: group.leftArm.map(mirrorMove),
        rightLeg: group.leftLeg.map(mirrorMove),
      };
    }

    function settle(move, ease) {
      const frames = move.frames.slice();
      const last = frames[frames.length - 1];
      frames[frames.length - 1] = { ...NEUTRAL, face: last.face === "to" ? "to" : 1 };
      return { title: move.title, dur: move.dur, ease, frames };
    }

    function prepare(ease) {
      const group = libraryFor(ease);
      if (group.groove) group.leftArm = group.leftArm.concat(group.groove);
      if (group.freeze) group.leftArm = group.leftArm.concat(group.freeze);
      if (group.line) group.leftArm = group.leftArm.concat(group.line);
      if (group.combo) group.leftArm = group.leftArm.concat(group.combo);
      if (group.pose) group.leftLeg = group.leftLeg.concat(group.pose);
      const sided = withSides(group);
      const kinds = ["leftArm", "rightArm", "leftLeg", "rightLeg", "jump", "turn"];
      const ready = {};
      for (const kind of kinds) ready[kind] = sided[kind].map((move) => settle(move, ease));
      return ready;
    }

    const MOVES = { leftArm: [], rightArm: [], leftLeg: [], rightLeg: [], jump: [], turn: [] };
    for (const ease of ["hiphop", "jazz", "pop"]) {
      const ready = prepare(ease);
      for (const kind of Object.keys(MOVES)) MOVES[kind].push(...ready[kind]);
    }

    let scene = "stage";
    let facing = 1;
    let clip = null;
    let lastInput = 0;
    let lastFrame = 0;
    let port = null;
    let opening = false;
    const lastAlt = {};
    const accent = { leftArm: 0, rightArm: 0, leftLeg: 0, rightLeg: 0, jump: 0, turn: 0 };
    const view = { ...NEUTRAL };
    const LANES = [
      { name: "左手", mark: "啪" },
      { name: "右手", mark: "啪" },
      { name: "左脚", mark: "咚" },
      { name: "右脚", mark: "咚" },
      { name: "跳跃", mark: "跳" },
      { name: "转身", mark: "转" },
    ];
    let mode = "live";
    let take = [];
    let takeStart = performance.now();
    let replay = null;

    function resize() {
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    addEventListener("resize", resize);
    resize();

    function idlePose(now) {
      if (scene === "subway") return { ...HOLD, face: facing >= 0 ? 1 : -1 };
      const home = { ...NEUTRAL, face: facing >= 0 ? 1 : -1 };
      const sway = Math.sin(now / 1400);
      const bob = Math.sin(now / 900);
      home.hipDrop += bob * 1.6;
      home.weight += sway * 3;
      home.armL += sway * -0.06;
      home.armR += sway * 0.06;
      home.lean += sway * 0.03;
      return home;
    }

    function buildTarget(now) {
      if (!clip) return finishPose(idlePose(now));
      return finishPose(sampleFrames(clip.frames, clip.u, clip.ease));
    }

    function pickTemplate(kind) {
      const list = MOVES[kind];
      let index = Math.floor(Math.random() * list.length);
      if (list.length > 1 && index === lastAlt[kind]) index = (index + 1) % list.length;
      lastAlt[kind] = index;
      return list[index];
    }

    function startKind(kind, now) {
      const template = pickTemplate(kind);
      now = now || performance.now();
      const from = facing >= 0 ? 1 : -1;
      const to = kind === "turn" ? -from : from;
      let dur = template.dur;
      if (lastInput && now - lastInput < 260) dur = Math.round(dur * 0.72);
      lastInput = now;
      clip = {
        kind,
        frames: template.frames.map((frame) => bindFrame(frame, from, to)),
        t0: now,
        dur,
        ease: template.ease,
        to,
        u: 0,
      };
    }

    function trigger(name) {
      if (mode !== "live") return;
      const kind = ACTIONS[name];
      if (!kind) return;
      startKind(kind);
      if (!clip) return;
      take.push({
        name,
        t: performance.now() - takeStart,
        kind: clip.kind,
        frames: clip.frames,
        dur: clip.dur,
        ease: clip.ease,
        to: clip.to,
      });
    }

    function renderTake() {
      const score = document.getElementById("score");
      score.innerHTML = "";
      if (!take.length) {
        const empty = document.createElement("div");
        empty.id = "empty-take";
        empty.textContent = "这一曲还没有按键";
        score.appendChild(empty);
        return;
      }
      const origin = take[0].t;
      const span = Math.max(1, take[take.length - 1].t - origin);
      const head = document.createElement("div");
      head.id = "playhead";
      score.appendChild(head);
      for (const lane of LANES) {
        const row = document.createElement("div");
        row.className = "lane";
        const label = document.createElement("span");
        label.textContent = lane.name;
        const track = document.createElement("div");
        track.className = "track";
        let lastLeft = -20;
        for (const hit of take) {
          if (hit.name !== lane.name) continue;
          const single = take.length < 2;
          let left = single ? 50 : ((hit.t - origin) / span) * 86 + 7;
          if (left - lastLeft < 7) left = lastLeft + 7;
          lastLeft = left;
          const mark = document.createElement("b");
          mark.textContent = lane.mark;
          mark.style.left = left + "%";
          track.appendChild(mark);
        }
        row.appendChild(label);
        row.appendChild(track);
        score.appendChild(row);
      }
    }

    function beginReplay() {
      const origin = take.length ? take[0].t : 0;
      replay = {
        events: take.map((hit) => ({ ...hit, at: hit.t - origin + 420 })),
        t0: performance.now(),
        index: 0,
        done: take.length === 0,
        span: take.length > 1 ? take[take.length - 1].t - origin : 0,
        lead: 420,
      };
      clip = null;
    }

    function showRecap() {
      mode = "show";
      renderTake();
      beginReplay();
      document.getElementById("recap").hidden = false;
      document.getElementById("end").hidden = true;
    }

    function movePlayhead(now) {
      const head = document.getElementById("playhead");
      if (!head || !replay || mode !== "show") return;
      const elapsed = now - replay.t0 - replay.lead;
      const p = replay.span <= 0 ? 0.5 : 7 + clamp(elapsed / replay.span, 0, 1) * 86;
      const score = head.parentElement;
      const track = Math.max(0, score.clientWidth - 50);
      head.style.left = (50 + (p / 100) * track) + "px";
    }

    function driveReplay(now) {
      if (mode !== "show" || !replay || replay.done) return;
      const elapsed = now - replay.t0;
      while (replay.index < replay.events.length && elapsed >= replay.events[replay.index].at) {
        const event = replay.events[replay.index++];
        clip = {
          kind: event.kind,
          frames: event.frames,
          t0: now,
          dur: event.dur,
          ease: event.ease,
          to: event.to,
          u: 0,
        };
      }
    }

    function tick(now) {
      if (!now) {
        requestAnimationFrame(tick);
        return;
      }
      const dt = Math.min(0.05, lastFrame ? (now - lastFrame) / 1000 : 0.016);
      lastFrame = now;
      driveReplay(now);
      if (clip) clip.u = (now - clip.t0) / clip.dur;
      if (clip && clip.u >= 1) {
        if (clip.kind === "turn") facing = clip.to;
        clip = null;
      }
      if (mode === "show" && replay && !replay.done && replay.index >= replay.events.length && !clip) {
        replay.done = true;
      }
      movePlayhead(now);
      const target = buildTarget(now);
      const rates = {
        armL: 34, armR: 34, elbowL: 28, elbowR: 28,
        footLy: 30, footRy: 30, footLx: 24, footRx: 24,
        shoulderL: 26, shoulderR: 26, hipDrop: 24, lean: 18, weight: 18,
        face: 40, spin: 22, width: 22,
      };
      for (const key of CHANNELS) {
        if (key === "face" && view.face * target.face < 0) {
          view.face = target.face;
          continue;
        }
        const follow = 1 - Math.exp(-dt * (rates[key] || 20));
        view[key] += (target[key] - view[key]) * follow;
      }
      if (clip) {
        const hot = Math.max(0.35, Math.sin(Math.min(clip.u, 1) * Math.PI));
        const parts = BIAS[clip.kind] || ["leftArm"];
        for (const key of Object.keys(accent)) accent[key] = 0;
        parts.forEach((part, index) => {
          accent[part] = hot * (index === 0 ? 1 : 0.55);
        });
      } else {
        for (const key of Object.keys(accent)) accent[key] *= Math.exp(-dt * 6);
      }
      draw();
      requestAnimationFrame(tick);
    }

    function solveLeg(hipX, hipY, footX, footY, thigh, shin, bendSign) {
      const dx = footX - hipX;
      const dy = footY - hipY;
      const dist = Math.hypot(dx, dy) || 0.0001;
      const reach = clamp(dist, Math.abs(thigh - shin) + 0.8, thigh + shin - 0.8);
      const cosHip = clamp((thigh * thigh + reach * reach - shin * shin) / (2 * thigh * reach), -1, 1);
      const thighAngle = Math.atan2(dx, dy) + bendSign * Math.acos(cosHip);
      const tx = hipX + (dx / dist) * reach;
      const ty = hipY + (dy / dist) * reach;
      return {
        knee: { x: hipX + Math.sin(thighAngle) * thigh, y: hipY + Math.cos(thighAngle) * thigh },
        foot: { x: tx, y: ty },
      };
    }

    function ink(hot) {
      ctx.strokeStyle = hot > 0.18 ? "#f0c36a" : "#f6f1e8";
      ctx.lineWidth = (hot > 0.18 ? 10 : 8.5) * devicePixelRatio;
    }

    function chain(points, hot) {
      ink(hot);
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
    }

    function bone(from, angle, length) {
      return { x: from.x + Math.sin(angle) * length, y: from.y + Math.cos(angle) * length };
    }

    let restGrip = null;

    function riderLine(points) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.stroke();
    }

    function drawPhone(x, y, w, h) {
      ctx.fillStyle = "#e8eef6";
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "rgba(126, 186, 232, 0.85)";
      ctx.fillRect(x + w * 0.16, y + h * 0.14, w * 0.68, h * 0.62);
    }

    function drawLoop(x, railY, handY, size) {
      const ry = 15 * devicePixelRatio * size;
      const rx = 11 * devicePixelRatio * size;
      const cy = handY;
      ctx.strokeStyle = "#c5ced8";
      ctx.lineWidth = 3.5 * devicePixelRatio * Math.max(1, size * 0.85);
      ctx.beginPath();
      ctx.moveTo(x, railY);
      ctx.lineTo(x, cy - ry);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawRider(x, y, scale, stand, now, seed, grip) {
      const bob = Math.sin(now / 1300 + seed) * 1.1;
      ctx.save();
      ctx.translate(x, y + bob);
      ctx.scale(scale, scale);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(214, 220, 228, 0.9)";
      ctx.lineWidth = Math.max(3.2, 2.15 * devicePixelRatio / scale);
      const headY = stand ? -132 : -78;
      ctx.beginPath();
      ctx.arc(0, headY, 14, 0, Math.PI * 2);
      ctx.stroke();
      if (stand) {
        const dir = grip || -1;
        riderLine([{ x: 0, y: -118 }, { x: 0, y: -62 }]);
        riderLine([{ x: -16, y: -108 }, { x: 16, y: -108 }]);
        riderLine([{ x: dir * 16, y: -108 }, { x: dir * 22, y: -158 }]);
        riderLine([{ x: -dir * 16, y: -108 }, { x: -dir * 8, y: -34 }]);
        riderLine([{ x: 0, y: -62 }, { x: -13, y: 2 }]);
        riderLine([{ x: 0, y: -62 }, { x: 14, y: 2 }]);
      } else {
        riderLine([{ x: 0, y: -64 }, { x: 2, y: -4 }]);
        riderLine([{ x: -16, y: -52 }, { x: 16, y: -52 }]);
        riderLine([{ x: -16, y: -52 }, { x: -8, y: -28 }, { x: -6, y: -8 }]);
        riderLine([{ x: 16, y: -52 }, { x: 8, y: -28 }, { x: 6, y: -8 }]);
        drawPhone(-8, -30, 16, 26);
        riderLine([{ x: 0, y: -4 }, { x: -24, y: 10 }, { x: -22, y: 42 }]);
        riderLine([{ x: 0, y: -4 }, { x: 24, y: 10 }, { x: 26, y: 42 }]);
      }
      ctx.restore();
    }

    function drawWindow(x, y, width, height, now, offset) {
      const glass = ctx.createLinearGradient(0, y, 0, y + height);
      glass.addColorStop(0, "#101820");
      glass.addColorStop(1, "#243444");
      ctx.fillStyle = glass;
      ctx.fillRect(x, y, width, height);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, width, height);
      ctx.clip();
      const span = width * 1.4;
      const slide = ((now / 16) + offset) % span;
      for (let i = -1; i < 6; i++) {
        const lx = x + ((slide + i * width * 0.28) % span) - width * 0.2;
        ctx.fillStyle = i % 2 ? "rgba(244, 214, 150, 0.55)" : "rgba(186, 214, 232, 0.42)";
        ctx.fillRect(lx, y + height * 0.22, Math.max(10, width * 0.045), height * 0.1);
        ctx.fillRect(lx + width * 0.08, y + height * 0.62, Math.max(16, width * 0.09), height * 0.08);
      }
      ctx.restore();
      ctx.strokeStyle = "#c5ced8";
      ctx.lineWidth = 4 * devicePixelRatio;
      ctx.strokeRect(x, y, width, height);
      ctx.beginPath();
      ctx.moveTo(x + width * 0.5, y);
      ctx.lineTo(x + width * 0.5, y + height);
      ctx.stroke();
    }

    function drawSubway(w, h, now) {
      ctx.fillStyle = "#1a212b";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "#10151c";
      ctx.fillRect(0, 0, w, h * 0.16);
      const wash = ctx.createLinearGradient(0, h * 0.1, 0, h * 0.28);
      wash.addColorStop(0, "rgba(236, 232, 210, 0.16)");
      wash.addColorStop(1, "rgba(236, 232, 210, 0)");
      ctx.fillStyle = wash;
      ctx.fillRect(0, h * 0.1, w, h * 0.18);
      ctx.fillStyle = "#f4f1e4";
      ctx.fillRect(w * 0.08, h * 0.095, w * 0.84, Math.max(4, h * 0.012));
      ctx.fillStyle = "rgba(244, 241, 228, 0.35)";
      ctx.fillRect(w * 0.08, h * 0.112, w * 0.84, Math.max(2, h * 0.004));

      const winY = h * 0.18;
      const winH = h * 0.2;
      drawWindow(w * 0.045, winY, w * 0.2, winH, now, 0);
      drawWindow(w * 0.755, winY, w * 0.2, winH, now, 80);

      const doorX = w * 0.36;
      const doorW = w * 0.28;
      const doorY = h * 0.17;
      const doorH = h * 0.57;
      ctx.fillStyle = "#2a3340";
      ctx.fillRect(doorX, doorY, doorW, doorH);
      ctx.strokeStyle = "#d5dbe3";
      ctx.lineWidth = 4 * devicePixelRatio;
      ctx.strokeRect(doorX, doorY, doorW, doorH);
      ctx.beginPath();
      ctx.moveTo(w * 0.5, doorY);
      ctx.lineTo(w * 0.5, doorY + doorH * 0.42);
      ctx.stroke();
      drawWindow(doorX + doorW * 0.07, doorY + doorH * 0.06, doorW * 0.35, doorH * 0.34, now, 40);
      drawWindow(doorX + doorW * 0.58, doorY + doorH * 0.06, doorW * 0.35, doorH * 0.34, now, 120);
      const handleY = doorY + doorH * 0.28;
      ctx.strokeStyle = "#e7ebf0";
      ctx.lineWidth = 5 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(doorX + doorW * 0.16, handleY);
      ctx.lineTo(doorX + doorW * 0.36, handleY);
      ctx.moveTo(doorX + doorW * 0.64, handleY);
      ctx.lineTo(doorX + doorW * 0.84, handleY);
      ctx.stroke();

      const mapY = h * 0.145;
      ctx.fillStyle = "#0c1016";
      ctx.fillRect(w * 0.4, mapY, w * 0.2, h * 0.018);
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.fillStyle = i === 3 ? "#f0c36a" : "#8ea0b4";
        ctx.arc(w * (0.43 + i * 0.023), mapY + h * 0.009, i === 3 ? 4.2 * devicePixelRatio : 2.6 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fill();
      }

      const riderScale = Math.min(w, h) * 0.00132;
      const floorY = h * 0.76;
      const standScale = riderScale * 1.02;
      const railY = h * 0.128;
      const standers = [
        { x: 0.28, grip: -1, seed: 1.2 },
        { x: 0.37, grip: 1, seed: 2.5 },
        { x: 0.63, grip: -1, seed: 3.8 },
        { x: 0.72, grip: 1, seed: 4.6 },
      ];
      ctx.strokeStyle = "#c5ced8";
      ctx.lineWidth = 3.5 * devicePixelRatio;
      ctx.beginPath();
      ctx.moveTo(w * 0.2, railY);
      ctx.lineTo(w * 0.8, railY);
      ctx.stroke();

      ctx.fillStyle = "#12181f";
      ctx.fillRect(0, floorY, w, h - floorY);
      ctx.fillStyle = "#e2b15a";
      ctx.fillRect(0, floorY, w, Math.max(4, h * 0.01));

      const seatY = h * 0.62;
      const seatW = w * 0.068;
      const places = [0.055, 0.135, 0.865, 0.945];
      for (const place of places) {
        const x = w * place;
        ctx.fillStyle = "#31404e";
        ctx.fillRect(x - seatW * 0.46, seatY - h * 0.125, seatW * 0.92, h * 0.12);
        ctx.fillStyle = "#6d8296";
        ctx.fillRect(x - seatW * 0.46, seatY - h * 0.125, seatW * 0.92, h * 0.012);
        ctx.fillStyle = "#41566a";
        ctx.fillRect(x - seatW * 0.58, seatY, seatW * 1.16, h * 0.038);
      }

      for (let i = 0; i < places.length; i++) {
        drawRider(w * places[i], seatY + h * 0.012, riderScale, false, now, i);
      }
      for (const rider of standers) {
        drawRider(w * rider.x, floorY, standScale, true, now, rider.seed, rider.grip);
        const bob = Math.sin(now / 1300 + rider.seed) * 1.1;
        drawLoop(w * rider.x + rider.grip * 22 * standScale, railY, floorY + bob - 158 * standScale, 1.25);
      }
    }

    function draw() {
      const dpr = devicePixelRatio;
      const w = canvas.width;
      const h = canvas.height;
      const subway = scene === "subway";
      const ground = subway ? h * 0.84 : h * 0.74;
      const cx = w * 0.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (subway) {
        drawSubway(w, h, lastFrame);
      } else {
        const backdrop = ctx.createRadialGradient(cx, ground - h * 0.22, h * 0.05, cx, h * 0.42, Math.max(w, h) * 0.72);
        backdrop.addColorStop(0, "#32281c");
        backdrop.addColorStop(0.42, "#161920");
        backdrop.addColorStop(1, "#090b10");
        ctx.fillStyle = backdrop;
        ctx.fillRect(0, 0, w, h);
      }

      const s = subway ? Math.min(w * 0.46, h * 0.66) / 340 : Math.min(w * 0.58, h * 0.86) / 340;
      const glow = ctx.createRadialGradient(cx, ground, 8 * dpr, cx, ground, subway ? 180 * s : 300 * s);
      glow.addColorStop(0, "rgba(240, 195, 106, 0.18)");
      glow.addColorStop(1, "rgba(240, 195, 106, 0)");
      ctx.fillStyle = glow;
      const glowW = subway ? 150 * s : 300 * s;
      ctx.beginPath();
      ctx.ellipse(cx, ground, glowW, subway ? 18 * s : 34 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      const thigh = 50 * s;
      const shin = 48 * s;
      const upper = 42 * s;
      const fore = 36 * s;
      const torso = 78 * s;
      const headR = 24 * s;
      const hipX = view.weight;
      const hipY = -90 + view.hipDrop;
      const airH = Math.max(0, -view.hipDrop, -Math.min(view.footLy, view.footRy) * 0.35);
      const shadowFade = Math.min(1, airH / 72);

      ctx.save();
      ctx.translate(cx + hipX * s * 0.25, ground);
      ctx.fillStyle = `rgba(0,0,0,${0.38 * (1 - shadowFade * 0.8)})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.max(8, 46 * s * (1 - shadowFade * 0.62) * (0.42 + 0.58 * view.width)), 8 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const upX = Math.sin(view.lean);
      const upY = -Math.cos(view.lean);
      const sideX = Math.cos(view.lean);
      const sideY = Math.sin(view.lean);
      const shoulder = { x: upX * torso, y: upY * torso };
      const leftShoulder = {
        x: shoulder.x - sideX * 16 * s + upX * view.shoulderL * 12 * s,
        y: shoulder.y - sideY * 16 * s + upY * view.shoulderL * 12 * s,
      };
      const rightShoulder = {
        x: shoulder.x + sideX * 16 * s + upX * view.shoulderR * 12 * s,
        y: shoulder.y + sideY * 16 * s + upY * view.shoulderR * 12 * s,
      };
      const head = {
        x: shoulder.x + upX * (headR + 10 * s),
        y: shoulder.y + upY * (headR + 10 * s),
      };
      const lElbow = bone(leftShoulder, view.armL, upper);
      const lHand = bone(lElbow, view.armL + view.elbowL, fore);
      const rElbow = bone(rightShoulder, view.armR, upper);
      const rHand = bone(rElbow, view.armR - view.elbowR, fore);
      const leftLeg = solveLeg(0, 0, (view.footLx - hipX) * s, (view.footLy - hipY) * s, thigh, shin, -1);
      const rightLeg = solveLeg(0, 0, (view.footRx - hipX) * s, (view.footRy - hipY) * s, thigh, shin, 1);

      if (subway && !clip && Math.abs(view.armL - HOLD.armL) < 0.15) {
        const faceSign = view.face < 0 ? -1 : 1;
        const spin = view.spin * 0.34;
        const lx = faceSign * view.width * lHand.x;
        const ly = lHand.y;
        const cos = Math.cos(spin);
        const sin = Math.sin(spin);
        restGrip = {
          x: cx + hipX * s + lx * cos - ly * sin,
          y: ground + hipY * s + lx * sin + ly * cos,
        };
      }
      if (subway && restGrip) drawLoop(restGrip.x, h * 0.128, restGrip.y, 1.35);

      ctx.save();
      ctx.translate(cx + hipX * s, ground + hipY * s);
      ctx.rotate(view.spin * 0.34);
      const faceSign = view.face < 0 ? -1 : 1;
      ctx.scale(faceSign * view.width, 1);
      chain([{ x: 0, y: 0 }, leftLeg.knee, leftLeg.foot], Math.max(accent.leftLeg, accent.jump));
      chain([{ x: 0, y: 0 }, rightLeg.knee, rightLeg.foot], Math.max(accent.rightLeg, accent.jump));
      const bodyHot = Math.max(accent.leftArm, accent.rightArm, accent.jump, accent.turn, accent.leftLeg, accent.rightLeg);
      chain([{ x: 0, y: 0 }, shoulder], bodyHot * 0.9);
      chain([leftShoulder, rightShoulder], bodyHot * 0.9);
      chain([leftShoulder, lElbow, lHand], Math.max(accent.leftArm, accent.turn, accent.jump * 0.7));
      chain([rightShoulder, rElbow, rHand], Math.max(accent.rightArm, accent.turn, accent.jump * 0.7));
      ink(Math.max(accent.turn, accent.jump) * 0.8);
      ctx.beginPath();
      ctx.arc(head.x, head.y, headR, 0, Math.PI * 2);
      ctx.stroke();
      ink(accent.turn);
      ctx.beginPath();
      ctx.moveTo(head.x + headR * 0.15, head.y - headR * 0.05);
      ctx.lineTo(head.x + headR * 0.92, head.y - headR * 0.2);
      ctx.stroke();
      ctx.restore();
    }

    addEventListener("keydown", (event) => {
      if (event.repeat || event.metaKey || event.ctrlKey || event.altKey) return;
      const name = KEYS[event.key.toLowerCase()];
      if (name) trigger(name);
    });

    function showConnect() {
      connectBtn.hidden = !navigator.serial;
    }

    async function readSerial() {
      if (!port || !port.readable) return;
      const reader = port.readable.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split(/\r?\n/);
          buf = lines.pop();
          for (const line of lines) {
            const text = line.trim();
            if (ACTIONS[text]) trigger(text);
          }
        }
      } catch (err) {
        port = null;
        showConnect();
      } finally {
        reader.releaseLock();
      }
    }

    async function openPort(selected) {
      await selected.open({ baudRate: 115200 });
      port = selected;
      connectBtn.hidden = true;
      readSerial();
    }

    async function autoConnect() {
      if (!navigator.serial || !navigator.serial.getPorts) {
        showConnect();
        return;
      }
      try {
        const ports = await navigator.serial.getPorts();
        if (ports.length) {
          await openPort(ports[0]);
          return;
        }
      } catch (err) {
        port = null;
      }
      showConnect();
    }

    document.getElementById("end").addEventListener("click", showRecap);
    document.getElementById("replay").addEventListener("click", beginReplay);
    document.getElementById("reset").addEventListener("click", () => {
      mode = "live";
      take = [];
      takeStart = performance.now();
      replay = null;
      clip = null;
      document.getElementById("recap").hidden = true;
      document.getElementById("end").hidden = false;
    });

    document.getElementById("scene").addEventListener("click", () => {
      scene = scene === "subway" ? "stage" : "subway";
      document.getElementById("scene").textContent = scene === "subway" ? "舞台" : "地铁";
    });

    connectBtn.addEventListener("click", async () => {
      if (opening || port || !navigator.serial) return;
      opening = true;
      try {
        const selected = await navigator.serial.requestPort();
        await openPort(selected);
      } catch (err) {
        port = null;
        if (err.name !== "NotFoundError") showConnect();
      } finally {
        opening = false;
      }
    });

    if (navigator.serial && navigator.serial.addEventListener) {
      navigator.serial.addEventListener("disconnect", () => {
        port = null;
        showConnect();
      });
    }

    autoConnect();
    tick();
  </script>
</body>
</html>
